name: Bug Report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, ETTP, OS, and relevant dependency versions.
    validations:
      required: true
